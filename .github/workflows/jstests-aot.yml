name: AOT jstests

# Weekly, and on dispatch: every jstest in the AOT lane (each test compiled
# in-process), about 3.5 h of tests at 4.2 tests/s (run 41086602517), split
# over SHARDS jobs. One build against the engine release (engine-release.yml
# with `jit_tests: none` and `jstests_inputs`) uploads the built shell and
# the release's test sources with the jstests bundle (js/src/tests whole,
# and xul-info.txt); each shard runs its slice
# (jstests.py --this-chunk; run-jstests-checked.py sorts the test walk so
# the slices partition one list). The nightly jstests.yml runs the
# interpreter lane.

on:
  schedule:
    # Sundays, 04:41 UTC.
    - cron: '41 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a running suite when a newer commit lands.
concurrency:
  group: jstests-aot-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The slices are contiguous in the sorted list, so slow directories stay
  # together. From the per-test times of run 41086602517 (30,177 of the
  # 52,523 tests measured, the rest estimated from their directories), five
  # put 51, 41, 36, 46 and 49 min in the shards on the 4-core runner; four
  # would put 66 min in the first. Keep the matrix below in step.
  SHARDS: 5

jobs:
  # As in jstests.yml, on this workflow's own runs: a scheduled run of a
  # yurt that has not moved since the newest completed scheduled or
  # dispatched run of this workflow on yurt repeats that result in seconds
  # (green skips, red fails here naming the red run); a dispatch always runs.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/nightly-gate.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD: ${{ github.sha }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          python3 scripts/nightly-gate.py --event "$EVENT" --head "$HEAD"
          --repo "$GITHUB_REPOSITORY" --workflow jstests-aot.yml --branch "$BRANCH"

  engine:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    uses: ./.github/workflows/engine-release.yml
    with:
      lane: aot
      jit_tests: none
      jstests_inputs: true

  shard:
    name: AOT jstests shard ${{ matrix.shard }}
    needs: engine
    runs-on: ubuntu-24.04
    # ci-suite.sh caps the jstests at 90 min.
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare logs
        run: mkdir -p "$RUNNER_TEMP/nightmonkey-logs"
      - name: Download the jstests inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightmonkey-jstests-inputs-aot
          path: ${{ runner.temp }}/jstests-inputs
      - name: Unpack the jstests inputs
        run: |
          set -euo pipefail
          test ! -e build
          mkdir -p "$RUNNER_TEMP/testsrc"
          zstd -dc "$RUNNER_TEMP/jstests-inputs/jstests-inputs.tar.zst" | tar -x -C "$RUNNER_TEMP/testsrc"
          mv "$RUNNER_TEMP/testsrc/build" build
          test -x build/bin/inproc-shell.sh
          test -f "$RUNNER_TEMP/testsrc/js/src/tests/jstests.py"
      - name: AOT jstests (shard ${{ matrix.shard }})
        timeout-minutes: 95
        run: |
          set -euo pipefail
          if [ "$SHARD" -lt 1 ] || [ "$SHARD" -gt "$SHARDS" ]; then
            echo "::error::shard $SHARD is outside 1..$SHARDS: keep the matrix and SHARDS in step"
            exit 1
          fi
          NIGHT_FIREFOX_TESTS="$RUNNER_TEMP/testsrc" \
            scripts/ci-suite.sh jstests aot -- --total-chunks="$SHARDS" --this-chunk="$SHARD"
      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightmonkey-execution-aot-jstests-shard${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightmonkey-logs
          if-no-files-found: error
          retention-days: 7
