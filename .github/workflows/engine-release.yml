name: Engine release integration

# NightMonkey built against a published YurtOS/yurt-firefox engine release
# instead of building Firefox: the release pinned in engine/ENGINE_RELEASE
# (tag and sha256 of MANIFEST.json and every asset) is downloaded, every
# digest is verified before anything is extracted, and NightMonkey is built
# against the engine archive with the release's own clang and WASI sysroot;
# the jit-tests (and with full_jstests the jstests) come from the release's
# test-source bundles. scripts/check-engine-release.sh guards the fetch, the
# build and the jit-test step; change them together.
#
# It is the only engine job: ci.yml (every event), jstests.yml (nightly,
# interpreter lane, full jstests) and jstests-aot.yml (weekly, AOT lane:
# jit_tests none, jstests_inputs for its shards) call it. To move to another
# release, run scripts/update-engine-release.sh <tag> (README "Engine
# release").

on:
  workflow_call:
    inputs:
      full_jstests:
        type: boolean
        default: false
      lane:
        description: 'aot, interpreter, or both'
        type: string
        default: both
      # full: every jit-test in this job (the nightly jstests runs).
      # subset: only JIT_SUBSET below (the pull request tier).
      # sharded: every jit-test, in jit-shards.yml's jobs, which take this
      #   job's build (the merge tier: push to yurt, dispatch, `ci:full`).
      # none: no jit-tests (the weekly AOT jstests, whose shards take this
      #   job's build; the merge tier runs the AOT jit-tests on every push).
      jit_tests:
        description: 'full, subset, sharded, or none'
        type: string
        default: full
      # Upload the built shell and the release's test sources with the
      # jstests bundle merged in, for jstests-aot.yml's shard jobs.
      jstests_inputs:
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # The pull request subset of jit-tests (jit_test.py path filters, matched as
  # substrings of the path under js/src/jit-test/tests). Chosen from the
  # per-test times of the full AOT lane in run 40547142771: warp/ (Warp
  # specialisation: CacheIR-driven inlining, bailouts), baseline/ (the
  # baseline tier) and sunspider/ (whole benchmark programs), 339 files,
  # about 560 s of test time, about 2.5 min on the 4-core runner, against
  # 11,100 s (46 min) for all 8,571. Every one passed in each of the 15 green
  # runs of 2026-10-20..28.
  JIT_SUBSET: warp/ baseline/ sunspider/

jobs:
  jit-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CI_LANE: ${{ inputs.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: |
          rustup show
          rustup target add wasm32-wasip1
          rustup component add rust-src
      - name: Prepare logs
        run: mkdir -p "$RUNNER_TEMP/nightmonkey-logs"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv build-essential zstd

      # gh wants a token even for a public repository; the job's read-only
      # one. Every digest is checked before anything is extracted.
      - name: Fetch the engine release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_JSTESTS: ${{ inputs.full_jstests || inputs.jstests_inputs }}
        run: scripts/fetch-engine-release.sh --jstests "$FULL_JSTESTS" "$RUNNER_TEMP"

      - name: Record the engine release
        env:
          TAG: ${{ steps.release.outputs.tag }}
          JIT_TESTS: ${{ inputs.jit_tests }}
        run: |
          echo "Engine release: YurtOS/yurt-firefox $TAG" | tee "$RUNNER_TEMP/nightmonkey-logs/engine.txt"
          echo "Engine release: YurtOS/yurt-firefox $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "### jit-tests: $JIT_TESTS (the pull request subset is \`$JIT_SUBSET\`; label a PR \`ci:full\` for all)" >> "$GITHUB_STEP_SUMMARY"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> build/cargo
          key: engine-release-ubuntu-24.04
          save-if: ${{ github.ref == 'refs/heads/yurt' }}

      - name: Build NightMonkey against the release
        id: build
        run: |
          cmake -S . -B build -DSPIDERMONKEY_DIST="$RUNNER_TEMP/spidermonkey" -DNIGHT_TOOLCHAIN_ROOT="$RUNNER_TEMP/toolchain/clang" -DNIGHT_SYSROOT="$RUNNER_TEMP/toolchain/sysroot-wasm32-wasi"
          cmake --build build
          test -x build/bin/inproc-shell.sh

      - name: Guest tier options contract
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/test-guest-tier-options.py build

      - name: Local regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 65
        run: scripts/ci-suite.sh local "$CI_LANE"

      # The default pipeline is MIR (the lanes above run it with strict
      # coverage); the baseline tier and MIR under its stress option get the
      # regression tests as tiers of their own.
      - name: Tier regressions (baseline, MIR stress)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 65
        run: |
          set -euo pipefail
          for opts in "--pipeline baseline --strict-coverage" \
                      "--pipeline mir --mir-stress 3 --strict-coverage"; do
            echo "::group::night tests: $opts"
            NIGHT_INPROC_STRICT=1 NIGHT_OPTIONS="$opts" scripts/run-night-tests.sh build
            echo "::endgroup::"
          done

      # After a failed regression step the jit-tests still run.
      - name: jit-tests from the release test sources
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.jit_tests != 'sharded' && inputs.jit_tests != 'none' }}
        timeout-minutes: 125
        env:
          JIT_TESTS: ${{ inputs.jit_tests }}
          NIGHT_FIREFOX_TESTS: ${{ runner.temp }}/testsrc
        run: |
          set -euo pipefail
          case "$JIT_TESTS" in
            full) scripts/ci-suite.sh jit "$CI_LANE" ;;
            subset)
              read -ra paths <<< "$JIT_SUBSET"
              scripts/ci-suite.sh jit "$CI_LANE" -- "${paths[@]}" ;;
            *) echo "::error::unknown jit_tests input: $JIT_TESTS"; exit 1 ;;
          esac

      # The shards' inputs: the built shell (build/bin is self-contained:
      # inproc-shell.sh runs js-inproc under wasm-jit-runner, both next to
      # it) and the release's test sources. A tar, because an artifact does
      # not keep the executable bit.
      - name: Package the shard inputs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.jit_tests == 'sharded' }}
        run: |
          set -euo pipefail
          tar -C "$GITHUB_WORKSPACE" -cf "$RUNNER_TEMP/shard-inputs.tar" build/bin
          tar -C "$RUNNER_TEMP/testsrc" -rf "$RUNNER_TEMP/shard-inputs.tar" js
          zstd -q -T0 --rm "$RUNNER_TEMP/shard-inputs.tar"
          ls -la "$RUNNER_TEMP/shard-inputs.tar.zst"

      - name: Upload the shard inputs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.jit_tests == 'sharded' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightmonkey-shard-inputs-${{ inputs.lane }}
          path: ${{ runner.temp }}/shard-inputs.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          # One name for every attempt: "Re-run failed jobs" reruns a failed
          # shard but not this job, so the shard must find this attempt's
          # upload; a rerun of this job replaces it.
          overwrite: true

      # The jstests shards' inputs (jstests-aot.yml): the built shell, as for
      # the jit-test shards, and the release test sources with the jstests
      # bundle merged in (test262, non262, the harness and its lib) and its
      # xul-info.txt, which run-jstests.sh reads from the test root.
      - name: Package the jstests inputs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.jstests_inputs }}
        run: |
          set -euo pipefail
          tar -C "$GITHUB_WORKSPACE" -cf "$RUNNER_TEMP/jstests-inputs.tar" build/bin
          tar -C "$RUNNER_TEMP/testsrc" -rf "$RUNNER_TEMP/jstests-inputs.tar" js xul-info.txt
          zstd -q -T0 --rm "$RUNNER_TEMP/jstests-inputs.tar"
          ls -la "$RUNNER_TEMP/jstests-inputs.tar.zst"

      - name: Upload the jstests inputs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.jstests_inputs }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightmonkey-jstests-inputs-${{ inputs.lane }}
          path: ${{ runner.temp }}/jstests-inputs.tar.zst
          if-no-files-found: error
          compression-level: 0
          # A week: "Re-run failed jobs" on the weekly run can come days later.
          retention-days: 7
          # One name for every attempt, as for the jit-test shard inputs.
          overwrite: true

      # The jstests asset was fetched for this (full_jstests), into the same
      # test-source root; its xul-info.txt reaches run-jstests.sh there.
      - name: Full jstests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.full_jstests }}
        timeout-minutes: 245
        env:
          NIGHT_FIREFOX_TESTS: ${{ runner.temp }}/testsrc
        run: scripts/ci-suite.sh jstests "$CI_LANE"

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightmonkey-execution-release-${{ inputs.lane }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightmonkey-logs
          if-no-files-found: error
          retention-days: 7
