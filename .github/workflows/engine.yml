name: Engine integration

on:
  workflow_call:
    inputs:
      full_jstests:
        type: boolean
        default: false
      lane:
        description: 'aot, interpreter, or both'
        type: string
        default: both
      # full: every jit-test in this job (the nightly jstests runs).
      # subset: only JIT_SUBSET below (the pull request tier).
      # sharded: every jit-test, split over JIT_SHARDS jobs that take this
      #   job's build (the merge tier: push to yurt, dispatch, `ci:full`).
      jit_tests:
        description: 'full, subset, or sharded'
        type: string
        default: full

permissions:
  contents: read

defaults:
  run:
    shell: bash

# The engine is built by YurtOS/yurt-firefox's scripts/build-engine.sh at the
# commit pinned in engine/QUEUE_PIN: pinned Firefox tag + patch queue. It leaves
# the patched tree in firefox/, which is also the jit-test/jstests source.
env:
  SM_OBJDIR: obj-nightmonkey-sm
  # The pull request subset of jit-tests (jit_test.py path filters, matched as
  # substrings of the path under js/src/jit-test/tests). Chosen from the
  # per-test times of the full AOT lane in run 40547142771: warp/ (Warp
  # specialisation: CacheIR-driven inlining, bailouts), baseline/ (the
  # baseline tier) and sunspider/ (whole benchmark programs), 339 files,
  # about 560 s of test time, about 2.5 min on the 4-core runner, against
  # 11,100 s (46 min) for all 8,571. Every one passed in each of the 15 green
  # runs of 2026-10-20..28.
  JIT_SUBSET: warp/ baseline/ sunspider/
  # jit_test.py --total-chunks: contiguous slices of the sorted test list.
  # Four put 2,300-3,000 s of AOT test time (10-13 min) in each shard.
  JIT_SHARDS: 4

jobs:
  jit-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CI_LANE: ${{ inputs.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: |
          rustup show
          rustup target add wasm32-wasip1
          rustup component add rust-src
      - name: Prepare logs
        run: mkdir -p "$RUNNER_TEMP/nightmonkey-logs"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv build-essential ccache

      - name: Read the engine queue pin
        id: pin
        run: |
          pin=$(cat engine/QUEUE_PIN)
          if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::engine/QUEUE_PIN is not a 40-hex commit SHA"
            exit 1
          fi
          echo "sha=$pin" >> "$GITHUB_OUTPUT"
          echo "Engine queue: YurtOS/yurt-firefox@$pin" | tee "$RUNNER_TEMP/nightmonkey-logs/engine.txt"
          echo "Engine queue: YurtOS/yurt-firefox@$pin" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the engine queue
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: YurtOS/yurt-firefox
          ref: ${{ steps.pin.outputs.sha }}
          path: engine-src
          fetch-depth: 0
          persist-credentials: false

      # GitHub serves any commit in the repository's fork network, and any
      # pull request head, by SHA. Build only a pin that has landed on
      # yurt-firefox main.
      - name: Verify the engine queue pin is on yurt-firefox main
        env:
          PIN: ${{ steps.pin.outputs.sha }}
        run: |
          git -C engine-src fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git -C engine-src rev-parse HEAD)" = "$PIN" || { echo "::error::engine-src is not at $PIN"; exit 1; }
          git -C engine-src merge-base --is-ancestor "$PIN" origin/main || { echo "::error::engine/QUEUE_PIN $PIN is not on YurtOS/yurt-firefox main"; exit 1; }

      # CI builds with the queue's mozconfig; local builds use spidermonkey/mozconfig.
      - name: Check spidermonkey/mozconfig matches the engine queue
        run: |
          cmp spidermonkey/mozconfig engine-src/mozconfig || { echo "::error::spidermonkey/mozconfig differs from YurtOS/yurt-firefox's mozconfig at engine/QUEUE_PIN: change it there and bump engine/QUEUE_PIN"; exit 1; }

      # ~/.mozbuild (toolchains, sysroot) is the cache that pays off. The
      # Firefox tree and objdir are rebuilt from the pin on every run: the
      # build script needs an empty workdir.
      #
      # Caches are written only from yurt (a push, or a dispatch on yurt);
      # pull requests restore them and save nothing (yurt-sandbox#367).
      - name: Restore the mach toolchains
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.mozbuild
          key: mozbuild-${{ runner.os }}-${{ steps.pin.outputs.sha }}
          restore-keys: mozbuild-${{ runner.os }}-

      # ccache for SpiderMonkey's C++ (mach reads CCACHE, the env form of
      # --with-ccache, so the shared mozconfig is unchanged). One entry per
      # yurt run (the key is immutable); a run restores the newest entry for
      # its queue pin, else the newest of any pin. The fresh checkout is the
      # same path in every run, and BASEDIR makes its paths relative anyway.
      - name: Restore the SpiderMonkey ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-sm-${{ runner.os }}-${{ steps.pin.outputs.sha }}-${{ github.run_id }}
          restore-keys: |
            ccache-sm-${{ runner.os }}-${{ steps.pin.outputs.sha }}-
            ccache-sm-${{ runner.os }}-

      - name: Build the engine (patched SpiderMonkey)
        run: |
          export CCACHE=ccache CCACHE_DIR="$HOME/.ccache" CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_COMPILERCHECK=content CCACHE_MAXSIZE=2G
          ccache -z
          engine-src/scripts/build-engine.sh --workdir "$GITHUB_WORKSPACE/firefox"
          cp "$GITHUB_WORKSPACE/build-manifest.json" "$RUNNER_TEMP/nightmonkey-logs/"
          {
            echo '### SpiderMonkey ccache'
            echo '```'
            ccache -s
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # After the build, so a cancelled or timed-out build saves nothing; a
      # failed one still keeps what it compiled.
      - name: Save the mach toolchains
        if: ${{ !cancelled() && (github.ref == 'refs/heads/yurt' || github.head_ref == 'agent/nightmonkey-ci-tiers') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.mozbuild
          key: mozbuild-${{ runner.os }}-${{ steps.pin.outputs.sha }}

      - name: Save the SpiderMonkey ccache
        if: ${{ !cancelled() && (github.ref == 'refs/heads/yurt' || github.head_ref == 'agent/nightmonkey-ci-tiers') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-sm-${{ runner.os }}-${{ steps.pin.outputs.sha }}-${{ github.run_id }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> build/cargo
          key: engine-ubuntu-24.04
          save-if: ${{ github.ref == 'refs/heads/yurt' }}

      - name: Build NightMonkey
        id: build
        run: |
          cmake -S . -B build -DSPIDERMONKEY_DIST="$GITHUB_WORKSPACE/firefox/$SM_OBJDIR/dist"
          cmake --build build
          test -x build/bin/inproc-shell.sh

      - name: Guest tier options contract
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/test-guest-tier-options.py build

      - name: Local regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 65
        run: scripts/ci-suite.sh local "$CI_LANE"

      # The default pipeline is MIR (the lanes above run it with strict
      # coverage); the baseline tier and MIR under its stress option get the
      # regression tests as tiers of their own.
      - name: Tier regressions (baseline, MIR stress)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 65
        run: |
          set -euo pipefail
          for opts in "--pipeline baseline --strict-coverage" \
                      "--pipeline mir --mir-stress 3 --strict-coverage"; do
            echo "::group::night tests: $opts"
            NIGHT_INPROC_STRICT=1 NIGHT_OPTIONS="$opts" scripts/run-night-tests.sh build
            echo "::endgroup::"
          done

      - name: jit-tests (${{ inputs.jit_tests == 'subset' && 'pull request subset' || 'all' }})
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.jit_tests != 'sharded' }}
        timeout-minutes: 125
        env:
          JIT_TESTS: ${{ inputs.jit_tests }}
        run: |
          set -euo pipefail
          case "$JIT_TESTS" in
            full) scripts/ci-suite.sh jit "$CI_LANE" ;;
            subset)
              read -ra paths <<< "$JIT_SUBSET"
              {
                echo "### jit-tests: pull request subset (\`${JIT_SUBSET}\`)"
                echo
                echo 'The full jit-tests run on a push to yurt, in sharded jobs, and'
                echo "on a pull request labelled \`ci:full\`."
              } >> "$GITHUB_STEP_SUMMARY"
              scripts/ci-suite.sh jit "$CI_LANE" -- "${paths[@]}" ;;
            *) echo "::error::unknown jit_tests input: $JIT_TESTS"; exit 1 ;;
          esac

      # The shards' inputs: the built shell (build/bin is self-contained:
      # inproc-shell.sh runs js-inproc under wasm-jit-runner, both next to
      # it) and the jit-test sources from the patched tree, the members
      # yurt-firefox's package-test-sources.sh puts in its testsrc bundle
      # (non262 whole, for the shell.js files jit-tests load from it). A tar,
      # because an artifact does not keep the executable bit.
      - name: Package the shard inputs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.jit_tests == 'sharded' }}
        run: |
          set -euo pipefail
          tar -C "$GITHUB_WORKSPACE" -cf "$RUNNER_TEMP/shard-inputs.tar" build/bin
          tar -C "$GITHUB_WORKSPACE/firefox" -rf "$RUNNER_TEMP/shard-inputs.tar" \
            js/src/jit-test js/src/tests/lib js/src/tests/non262 js/src/jsapi.h
          zstd -q -T0 --rm "$RUNNER_TEMP/shard-inputs.tar"
          ls -la "$RUNNER_TEMP/shard-inputs.tar.zst"

      - name: Upload the shard inputs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.jit_tests == 'sharded' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightmonkey-shard-inputs-${{ inputs.lane }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shard-inputs.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Full jstests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.full_jstests }}
        timeout-minutes: 245
        run: scripts/ci-suite.sh jstests "$CI_LANE"

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightmonkey-execution-${{ inputs.lane }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightmonkey-logs
          if-no-files-found: error
          retention-days: 7

  # The full jit-tests, sharded (jit_tests: sharded). Each shard runs its
  # slice in every requested lane against the build job's shell; together the
  # slices are the whole list (jit_test.py chunks the sorted list after the
  # excludes). Skipped, as a whole, in the other modes.
  jit-test-shard:
    name: jit-test shard ${{ matrix.shard }}
    needs: jit-test
    if: ${{ inputs.jit_tests == 'sharded' }}
    runs-on: ubuntu-24.04
    # A shard's AOT slice is 10-13 min; ci-suite.sh caps a lane at 60.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI_LANE: ${{ inputs.lane }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare logs
        run: mkdir -p "$RUNNER_TEMP/nightmonkey-logs"
      - name: Download the shard inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightmonkey-shard-inputs-${{ inputs.lane }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shard-inputs
      - name: Unpack the shard inputs
        run: |
          set -euo pipefail
          test ! -e build
          mkdir -p "$RUNNER_TEMP/testsrc"
          zstd -dc "$RUNNER_TEMP/shard-inputs/shard-inputs.tar.zst" | tar -x -C "$RUNNER_TEMP/testsrc"
          mv "$RUNNER_TEMP/testsrc/build" build
          test -x build/bin/inproc-shell.sh
          test -f "$RUNNER_TEMP/testsrc/js/src/jit-test/jit_test.py"
      - name: jit-tests (shard ${{ matrix.shard }} of ${{ env.JIT_SHARDS }})
        timeout-minutes: 125
        run: |
          set -euo pipefail
          [ "$SHARD" -ge 1 ] && [ "$SHARD" -le "$JIT_SHARDS" ] ||
            { echo "::error::shard $SHARD is outside 1..$JIT_SHARDS (update the matrix with JIT_SHARDS)"; exit 1; }
          NIGHT_FIREFOX_TESTS="$RUNNER_TEMP/testsrc" \
            scripts/ci-suite.sh jit "$CI_LANE" -- --total-chunks="$JIT_SHARDS" --this-chunk="$SHARD"
      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightmonkey-execution-${{ inputs.lane }}-shard${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightmonkey-logs
          if-no-files-found: error
          retention-days: 7
