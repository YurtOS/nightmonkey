name: Full jstests

# Nightly: the interpreter lane (the engine as built, tier off), the full
# jit-tests and every jstest, about 30 min. The AOT lane's jstests take about
# 3.5 h (every test compiled), so they run weekly in five shards instead
# (jstests-aot.yml); the AOT jit-tests run on every push to yurt (ci.yml).

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Scheduled runs use the default branch (yurt). Do not cancel long suites
# when a newer commit lands; preserve the completed result for each run.
concurrency:
  group: jstests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Seconds, not hours: a scheduled run of a yurt that has not moved since
  # the newest completed scheduled or dispatched run on yurt repeats that
  # run's result without a rebuild: green skips the lane, red fails here naming the red run. Any
  # other conclusion, no previous run or an unreadable runs API runs the
  # suites; a dispatch always does (scripts/nightly-gate.py).
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/nightly-gate.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD: ${{ github.sha }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          python3 scripts/nightly-gate.py --event "$EVENT" --head "$HEAD"
          --repo "$GITHUB_REPOSITORY" --workflow jstests.yml --branch "$BRANCH"
  interpreter:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    uses: ./.github/workflows/engine-release.yml
    with:
      lane: interpreter
      full_jstests: true
