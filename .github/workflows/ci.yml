name: CI

# Two tiers, to keep pull-request CI cheap. Every event runs the Rust, workflow
# and script jobs and builds NightMonkey against the engine release pinned in
# engine/ENGINE_RELEASE (engine-release.yml's jit-test job: the fetch, the
# build, local and tier regressions). The jit-tests are tiered:
#   pull request tier: the JIT_SUBSET path filters of engine-release.yml, both
#     lanes, in the build job.
#   merge tier: every jit-test, split over jit-shards.yml's four shard jobs.
#     It runs on a push to yurt, in a merge queue (merge_group), on a
#     workflow_dispatch, and on a pull request while it carries `ci:full`.
# The `tier` job reads the label through the API when the run starts, not
# from the event: a push's event carries the labels of the moment it was
# sent, so a push a few seconds after labelling would take the pull request
# tier and cancel the `labeled` run (yurt-playground#276). Adding the label
# starts a run (the `labeled` type); while it is on, every push runs the
# merge tier.
#
# A pull request that changes only Markdown (every file, and every renamed
# file's old name, ends in .md; nothing in the repository reads one) runs
# only the lint jobs: Rust (fmt) and workflows. The tier job lists the files
# through the API; an API error or an empty list fails it. With `ci:full`,
# and on every other event, everything runs.
#
# Any other label starts a run too (the event cannot filter on the label).
# That run gets a concurrency group of its own (its run id), so it cancels
# nothing, and the tier job's `if:` skips it, which skips every job (they
# all need the tier). Its skipped checks can show as the latest for the head
# over an earlier red one; no check here is required, so nothing is bypassed,
# but read the run list, not only the checks summary.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [yurt]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Each push to yurt has a group of its own: a group holds one running and one
# waiting run, and a newer waiting run replaces the older, so back-to-back
# merges would drop the middle one's merge-tier result. So has a run started
# by a label other than ci:full (see the top).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci:full' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust (${{ matrix.check }})
    needs: tier
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # [fmt] on a Markdown-only pull request (see the top).
        check: ${{ fromJSON(needs.tier.outputs.rust_checks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.check }}
      - name: Check formatting
        if: matrix.check == 'fmt'
        run: cargo fmt --all -- --check
      - name: Check workspace
        if: matrix.check == 'check'
        run: cargo check --workspace --locked
      - name: Test workspace
        if: matrix.check == 'test'
        run: cargo test --workspace --locked
      # The non-default engine versions (compiler/src/opcodes/).
      - name: Test workspace (ff159)
        if: matrix.check == 'test'
        run: cargo test --workspace --locked --no-default-features --features ff159
      - name: Lint workspace
        if: matrix.check == 'clippy'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint workspace (ff159)
        if: matrix.check == 'clippy'
        run: |
          cargo clippy --workspace --all-targets --locked --no-default-features --features ff159 -- -D warnings
          cargo clippy --workspace --all-targets --locked --no-default-features --features ff159,parallel -- -D warnings

  workflows:
    needs: tier
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck=
      # Here, not only in the scripts job: that job skips on a docs-only
      # pull request, which would let a classifier broken into answering
      # "docs-only" skip the test that catches it.
      - name: Test the CI tier wiring
        run: python3 -m unittest discover -s scripts/tests -p test_ci_tiers.py

  scripts:
    needs: tier
    if: needs.tier.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: rustup show
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh scripts/*.sh.in; do
            bash -n "$script"
          done
      - name: Check the engine release pin
        run: scripts/check-engine-release.sh
      - name: Test opcode generation and regression harness
        run: python3 -m unittest discover -s scripts/tests -v

  # Picks the jit-test tier (see the top). An API error fails the job, and
  # with it the engine, never picks a tier.
  tier:
    # Not on a run started by a label other than ci:full (see the top).
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:full'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Read only: the pull request's labels.
      pull-requests: read
    outputs:
      jit_tests: ${{ steps.tier.outputs.jit_tests }}
      docs_only: ${{ steps.tier.outputs.docs_only }}
      rust_checks: ${{ steps.tier.outputs.rust_checks }}
    steps:
      - name: Pick the jit-test tier
        id: tier
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          jit_tests=sharded
          docs_only=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            labels=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name')
            if ! grep -qx 'ci:full' <<< "$labels"; then
              jit_tests=subset
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
                --jq '.[] | .filename, (.previous_filename // empty)')
              if [ -z "$files" ]; then
                echo "::error::the API listed no changed files for #$PR" >&2
                exit 1
              fi
              # pulls/files stops at 3000 files: a list that long runs everything.
              if [ "$(wc -l <<< "$files")" -lt 3000 ] && ! grep -qvE '\.md$' <<< "$files"; then
                docs_only=true
              fi
            fi
          fi
          if [ "$docs_only" = true ]; then
            rust_checks='["fmt"]'
            echo '### Markdown-only pull request: lint only (Rust fmt, workflows)' >> "$GITHUB_STEP_SUMMARY"
          else
            rust_checks='["fmt","check","test","clippy"]'
          fi
          {
            echo "jit_tests=$jit_tests"
            echo "docs_only=$docs_only"
            echo "rust_checks=$rust_checks"
          } >> "$GITHUB_OUTPUT"
          if [ "$jit_tests" = subset ]; then
            echo "### jit-tests: pull request subset (label the PR \`ci:full\` for all of them)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### jit-tests: all, sharded (merge tier)' >> "$GITHUB_STEP_SUMMARY"
          fi

  # The engine is the published release pinned in engine/ENGINE_RELEASE.
  engine:
    needs: tier
    if: needs.tier.outputs.docs_only != 'true'
    uses: ./.github/workflows/engine-release.yml
    with:
      jit_tests: ${{ needs.tier.outputs.jit_tests }}

  # The merge tier's jit-tests (see the top), from the engine job's build.
  # On the pull request tier the whole job is skipped.
  jit-shards:
    needs: [tier, engine]
    if: ${{ needs.tier.outputs.jit_tests == 'sharded' }}
    uses: ./.github/workflows/jit-shards.yml
