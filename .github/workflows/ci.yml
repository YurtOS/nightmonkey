name: CI

# Two tiers (YurtOS/yurt-sandbox#367). Every event runs the Rust, workflow
# and script jobs and builds the engine (engine.yml's jit-test job: the
# build, local and tier regressions). The jit-tests are tiered:
#   pull request tier: the JIT_SUBSET path filters of engine.yml, both lanes,
#     in the build job.
#   merge tier: every jit-test, split over engine.yml's JIT_SHARDS shard jobs.
#     It runs on a push to yurt, in a merge queue (merge_group), on a
#     workflow_dispatch, and on a pull request while it carries `ci:full`.
# The `tier` job reads the label through the API when the run starts, not
# from the event: a push's event carries the labels of the moment it was
# sent, so a push a few seconds after labelling would take the pull request
# tier and cancel the `labeled` run (yurt-playground#276). Adding the label
# starts a run (the `labeled` type); while it is on, every push runs the
# merge tier. Any label starts a run, which cancels the one in progress and
# runs the same jobs again; labels are rare here.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [yurt]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Each push to yurt has a group of its own: a group holds one running and one
# waiting run, and a newer waiting run replaces the older, so back-to-back
# merges would drop the middle one's merge-tier result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust (${{ matrix.check }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [fmt, check, test, clippy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.check }}
      - name: Check formatting
        if: matrix.check == 'fmt'
        run: cargo fmt --all -- --check
      - name: Check workspace
        if: matrix.check == 'check'
        run: cargo check --workspace --locked
      - name: Test workspace
        if: matrix.check == 'test'
        run: cargo test --workspace --locked
      - name: Lint workspace
        if: matrix.check == 'clippy'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck=

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: rustup show
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh scripts/*.sh.in; do
            bash -n "$script"
          done
      - name: Check the engine source pin
        run: scripts/check-engine-source.sh
      - name: Test opcode generation and regression harness
        run: python3 -m unittest discover -s scripts/tests -v

  # Picks the jit-test tier (see the top). An API error fails the job, and
  # with it the engine, never picks a tier.
  tier:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Read only: the pull request's labels.
      pull-requests: read
    outputs:
      jit_tests: ${{ steps.tier.outputs.jit_tests }}
    steps:
      - name: Pick the jit-test tier
        id: tier
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          jit_tests=sharded
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            labels=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name')
            grep -qx 'ci:full' <<< "$labels" || jit_tests=subset
          fi
          echo "jit_tests=$jit_tests" >> "$GITHUB_OUTPUT"
          if [ "$jit_tests" = subset ]; then
            echo "### jit-tests: pull request subset (label the PR \`ci:full\` for all of them)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### jit-tests: all, sharded (merge tier)' >> "$GITHUB_STEP_SUMMARY"
          fi

  engine:
    needs: tier
    uses: ./.github/workflows/engine.yml
    with:
      jit_tests: ${{ needs.tier.outputs.jit_tests }}
