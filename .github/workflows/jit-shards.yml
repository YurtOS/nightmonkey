name: jit-test shards

# The merge tier's jit-tests (YurtOS/yurt-sandbox#367): every jit-test, split
# over SHARDS jobs. Called by ci.yml after engine.yml ran with
# `jit_tests: sharded`, which uploads the inputs: the built shell (build/bin)
# and the jit-test sources of the patched tree. Each shard runs its slice in
# every requested lane; together the slices are the whole list (jit_test.py
# --total-chunks takes contiguous slices of the sorted list, after the
# excludes). A separate workflow so that engine.yml keeps the one job
# scripts/check-engine-source.sh guards.

on:
  workflow_call:
    inputs:
      lane:
        description: 'aot, interpreter, or both'
        type: string
        default: both

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Four put 2,300-3,000 s of AOT test time (10-13 min on the 4-core
  # runner) in each shard, from the per-test times of run 40547142771.
  # Keep the matrix below in step.
  SHARDS: 4

jobs:
  jit-test:
    name: jit-test shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    # ci-suite.sh caps a lane at 60 min.
    timeout-minutes: 140
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI_LANE: ${{ inputs.lane }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare logs
        run: mkdir -p "$RUNNER_TEMP/nightmonkey-logs"
      - name: Download the shard inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightmonkey-shard-inputs-${{ inputs.lane }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shard-inputs
      - name: Unpack the shard inputs
        run: |
          set -euo pipefail
          test ! -e build
          mkdir -p "$RUNNER_TEMP/testsrc"
          zstd -dc "$RUNNER_TEMP/shard-inputs/shard-inputs.tar.zst" | tar -x -C "$RUNNER_TEMP/testsrc"
          mv "$RUNNER_TEMP/testsrc/build" build
          test -x build/bin/inproc-shell.sh
          test -f "$RUNNER_TEMP/testsrc/js/src/jit-test/jit_test.py"
      - name: jit-tests (shard ${{ matrix.shard }})
        timeout-minutes: 125
        run: |
          set -euo pipefail
          if [ "$SHARD" -lt 1 ] || [ "$SHARD" -gt "$SHARDS" ]; then
            echo "::error::shard $SHARD is outside 1..$SHARDS: keep the matrix and SHARDS in step"
            exit 1
          fi
          NIGHT_FIREFOX_TESTS="$RUNNER_TEMP/testsrc" \
            scripts/ci-suite.sh jit "$CI_LANE" -- --total-chunks="$SHARDS" --this-chunk="$SHARD"
      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightmonkey-execution-${{ inputs.lane }}-shard${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightmonkey-logs
          if-no-files-found: error
          retention-days: 7
