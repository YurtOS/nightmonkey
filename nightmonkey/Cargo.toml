[package]
name = "nightmonkey"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true

[features]
default = ["ff147", "parallel"]
# Engine version (see compiler/src/opcodes/): exactly one.
ff147 = ["night-compiler/ff147", "night-snapshot/ff147"]
ff159 = ["night-compiler/ff159", "night-snapshot/ff159"]
parallel = ["dep:rayon", "night-compiler/parallel", "waffle/parallel"]
wizen = ["dep:wizer", "dep:libc"]

[dependencies]
night-compiler = { path = "../compiler", default-features = false }
night-snapshot = { path = "../snapshot", default-features = false }
waffle = "0.3.3"
rayon = { version = "1", optional = true }
anyhow = "1"
wizer = { version = "9", optional = true }
libc = { version = "0.2", optional = true }

[[bin]]
name = "nightmonkey"
path = "src/main.rs"
