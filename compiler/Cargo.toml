[package]
name = "night-compiler"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[features]
# The engine version whose opcode table (compiler/src/opcodes/<version>.rs)
# the compiler is built for: exactly one.
default = ["ff147"]
ff147 = []
ff159 = []
parallel = ["dep:rayon"]

[dependencies]
# AOT Wasm emitter: builds the codegen core module and merges it into
# the runtime reactor module (weval-style).
waffle = "0.3.3"
log = "0.4"
# Optional host-only MIR prebuilding; guest builds remain sequential.
rayon = { version = "1", optional = true }
# Fast non-SipHash maps: the translator/merge keys are small integers (pcs,
# entity ids), and profile showed SipHash dominating large-input translation.
rustc-hash = "2"
# Blob carving for the in-process batch path; version-matched to waffle's.
wasmparser = { version = "0.248", default-features = false, features = ["std", "validate", "simd"] }
# Assembling the batch into one mountable module (wasm::assemble).
wasm-encoder = { version = "0.248", default-features = false, features = ["std"] }

[dev-dependencies]
wasmtime = { version = "45", default-features = false, features = ["std", "runtime", "cranelift", "threads"] }
